
name: AI Motion Studio Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chrome
        run: npx remotion browser ensure

      - name: Render video
        run: npm run build

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: AI-MOTION-STUDIO-VIDEO
          path: out/video.mp4
